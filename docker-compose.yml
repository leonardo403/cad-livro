services:
  db:
    image: mysql:8.4
    container_name: cadastro_livros_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cadastro_livro
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts de schema, seed e view rodam automaticamente no primeiro start
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadastro_livros_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app123@db:3306/cadastro_livro?serverVersion=8.4&charset=utf8mb4"
    ports:
      - "8080:80"

volumes:
  mysql_data: